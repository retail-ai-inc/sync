name: Lint

on:
  push:
    branches:
      - main
      - develop
    paths-ignore:
      - '**/*.md'
      - '**.json'
      - 'Dockerfile'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - '**.json'
      - 'Dockerfile'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  golangci-lint:
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - name: golangci-lint
        uses: reviewdog/action-golangci-lint@v2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          go_version: '1.26'
          level: error
          filter_mode: nofilter
          reporter: github-pr-review
          fail_level: error
          golangci_lint_version: "v2.15.0"
<!doctype html>
<meta charset="utf-8">
<title>sync settings</title>
<style>
  :root { color-scheme: light dark; }
  body { font: 14px/1.5 system-ui, sans-serif; max-width: 46rem; margin: 2rem auto; padding: 0 1rem; }
  h1 { font-size: 1.3rem; margin-bottom: .25rem; }
  p.lede { margin-top: 0; opacity: .75; }
  fieldset { border: 1px solid rgba(128,128,128,.35); border-radius: .4rem; margin: 0 0 1rem; padding: .75rem 1rem 1rem; }
  legend { padding: 0 .35rem; font-weight: 600; }
  label { display: grid; grid-template-columns: 1fr 9rem; gap: .75rem; align-items: center; margin: .55rem 0; }
  label span small { display: block; font-weight: 400; opacity: .7; }
  input[type=number] { width: 100%; padding: .3rem .4rem; }
  input[type=checkbox] { justify-self: start; }
  .over { color: #b26a00; font-size: .85em; margin: .2rem 0 0; }
  button { padding: .45rem 1rem; font: inherit; }
  #said { margin-left: .75rem; }
  .bad { color: #c0392b; }
  .good { color: #227d3f; }
</style>

<h1>Settings</h1>
<p class="lede">Stored in the control database and read when a task next starts.
  Zero means the built-in default.</p>

<form id="form">
  <fieldset>
    <legend>Consistency check</legend>
    <label><span>Interval, seconds
      <small>0 leaves it off. A full comparison reads every replicated row twice.</small></span>
      <input type="number" min="0" name="verifyIntervalSeconds"></label>
    <label><span>Repair what it finds
      <small>Off unless asked for: a check that repairs is a second writer.</small></span>
      <input type="checkbox" name="verifyRepair"></label>
  </fieldset>

  <fieldset>
    <legend>Monitoring</legend>
    <label><span>Lag alert, seconds<small>0 keeps the default.</small></span>
      <input type="number" min="0" name="lagAlertSeconds"></label>
    <label><span>Keep monitoring history, days<small>0 keeps the default.</small></span>
      <input type="number" min="0" name="monitoringRetentionDays"></label>
  </fieldset>

  <fieldset>
    <legend>Batches</legend>
    <label><span>Events per batch<small>0 keeps the default of 500.</small></span>
      <input type="number" min="0" name="batchMaxEvents"></label>
    <label><span>Bytes per batch
      <small>0 keeps the default of 64MB. This is what bounds the memory a batch of large rows takes.</small></span>
      <input type="number" min="0" name="batchMaxBytes"></label>
  </fieldset>

  <fieldset>
    <legend>MongoDB escape hatch</legend>
    <label><span>Apply batches without a transaction
      <small>Gives up the atomicity of a batch: a half-applied batch and its position stop being one thing.</small></span>
      <input type="checkbox" name="mongoNoTransaction"></label>
  </fieldset>

  <button type="submit">Save</button><span id="said"></span>
</form>

<script>
const fields = ["verifyIntervalSeconds","verifyRepair","lagAlertSeconds",
  "monitoringRetentionDays","batchMaxEvents","batchMaxBytes","mongoNoTransaction"];
const form = document.getElementById("form");
const said = document.getElementById("said");

function headers() {
  const token = localStorage.getItem("accessToken");
  const h = {"Content-Type": "application/json"};
  if (token) h["Authorization"] = "Bearer " + token;
  return h;
}

function say(text, ok) {
  said.textContent = text;
  said.className = ok ? "good" : "bad";
}

function show(body) {
  for (const name of fields) {
    const input = form.elements[name];
    if (input.type === "checkbox") input.checked = !!body.data[name];
    else input.value = body.data[name];
  }
  // A value a variable is overruling is shown as such: telling somebody their
  // change took effect when it did not is worse than not offering the field.
  document.querySelectorAll("p.over").forEach(p => p.remove());
  for (const [name, why] of Object.entries(body.overridden || {})) {
    const input = form.elements[name];
    if (!input) continue;
    const note = document.createElement("p");
    note.className = "over";
    note.textContent = "Overruled by the environment: " + why;
    input.closest("label").after(note);
  }
}

async function load() {
  const answer = await fetch("/api/settings", {headers: headers()});
  if (answer.status === 401) return say("Sign in to the application first.", false);
  const body = await answer.json();
  if (!body.success) return say(body.message || "Could not read the settings.", false);
  show(body);
  say("", true);
}

form.addEventListener("submit", async event => {
  event.preventDefault();
  const payload = {};
  for (const name of fields) {
    const input = form.elements[name];
    payload[name] = input.type === "checkbox" ? input.checked : Number(input.value || 0);
  }
  const answer = await fetch("/api/settings",
    {method: "PUT", headers: headers(), body: JSON.stringify(payload)});
  const body = await answer.json().catch(() => ({}));
  if (answer.status === 401) return say("Sign in to the application first.", false);
  if (answer.status === 403) return say("An administrator has to change these.", false);
  if (!answer.ok || !body.success) return say(body.message || "Not saved.", false);
  show(body);
  say("Saved. A task reads these when it next starts.", true);
});

load();
</script>
